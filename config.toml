# Live settings for this machine — see config.example.toml for every option.
# Both panels are mounted vertically, so each renders on a portrait canvas and
# gets rotated into its own framebuffer — opposite directions, because the two
# panels sit the opposite way up relative to their native orientation.

[global]
readout_hz = 2.0
anim = "normal"

[owner]
name = "Lucas Bui"
role = "Senior AI Engineer"
date = "24/09/1997"

[lianli]
view = "system-electric"
rotate = 0
fps = 19.0           # measured ceiling 22.6 — just under, no frame backlog

[jungle]
view = "clock-electric"
rotate = 90
fps = 17.0           # measured ceiling 20.0
brightness = 100

[led]
enabled = true
style = "sweep"
fps = 24.0
brightness = 0.3
offset = 51          # LED 0 ở ~1/3 trên cạnh trái… (cân bằng mắt 3 lần quan sát)
reverse = true       # …và chuỗi chạy xuống dưới trước (ngược kim đồng hồ)
skew_left = 1        # mép trái sáng sớm hơn 1 LED cho khớp mép phải

[case_led]
enabled = false      # tắt theo yêu cầu — đèn case giữ hiệu ứng gốc của firmware
fps = 10.0
brightness = 0.7
min_devices = 2
